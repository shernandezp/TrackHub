# =============================================================================
# TrackHub - LOCAL nginx (Docker Desktop / Windows)
# =============================================================================
# Used ONLY by docker-compose.local.yml. Production keeps nginx.conf and
# nginx.backend.conf; neither is read here.
#
# Differences from the production config, all deliberate:
#
#   * Listens on 80/443 inside the container, published as 8080/8443. IIS owns
#     :80/:443 on this machine and keeps them.
#
#   * "proxy_set_header Host $http_host" instead of "$host". $host DROPS the port,
#     and the Authority Server derives the OIDC issuer from the Host header
#     (Program.cs enables ForwardedHeaders for XForwardedFor|XForwardedProto only -
#     NOT XForwardedHost). With $host the issuer would come back as
#     https://trackhub.local/Identity while every service validates against
#     https://trackhub.local:8443/Identity, and every call would 401.
#
#   * No rate limiting. The production limit_req zones would throttle a debug session.
#
#   * 3600s proxy timeouts. Sitting on a breakpoint for more than the production
#     90s read timeout would otherwise surface as a 504 instead of a paused process.
#
#   * Upstreams come from local.d/upstreams/*.conf, one file per service, so a single
#     service can be repointed at the Visual Studio debugger on the host without
#     touching this file. See scripts/local/Set-DebugTarget.ps1.
#
#   * No frontend root. The portal runs on the Vite dev server at https://localhost:3000.
# =============================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" -> $upstream_addr';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # GraphQL documents and document uploads are larger than the nginx default of 1m.
    client_max_body_size 64m;

    # Correct WebSocket upgrade handling for GraphQL subscriptions: send
    # "Connection: upgrade" only when the client actually asked to upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # One file per service. The default set points at the Docker service names;
    # Set-DebugTarget.ps1 rewrites a single file to host.docker.internal:<port>.
    include /etc/nginx/local.d/upstreams/*.conf;

    # -------------------------------------------------------------------------
    # Plain HTTP (published as 8080) - redirect to HTTPS on 8443.
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name trackhub.local localhost;

        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # HTTPS (published as 8443) - the TrackHub entry point.
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name trackhub.local localhost;

        ssl_certificate     /etc/nginx/ssl/trackhub-local.crt;
        ssl_certificate_key /etc/nginx/ssl/trackhub-local.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Shared proxy behaviour. Host carries the port on purpose - see header comment.
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_cache_bypass $http_upgrade;

        # Long enough to sit on a breakpoint.
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        # ---------------------------------------------------------------------
        # Identity. No trailing slash on proxy_pass: the /Identity prefix must be
        # preserved, because the Authority Server calls app.UsePathBase("/Identity").
        # ---------------------------------------------------------------------
        location /Identity/ {
            proxy_pass http://authority_server;
        }

        # ---------------------------------------------------------------------
        # APIs. Trailing slash on proxy_pass strips the path prefix, matching production.
        # ---------------------------------------------------------------------
        location /Security/       { proxy_pass http://security_api/; }
        location /Manager/        { proxy_pass http://manager_api/; }
        location /Router/         { proxy_pass http://router_api/; }
        location /Geofence/       { proxy_pass http://geofencing_api/; }
        location /Trip/           { proxy_pass http://trip_api/; }
        location /Telemetry/      { proxy_pass http://telemetry_api/; }
        location /Reporting/      { proxy_pass http://reporting_api/; }

        # ---------------------------------------------------------------------
        # Health probes, same shape as production so the portal status page works.
        # ---------------------------------------------------------------------
        location = /health              { return 200 "healthy\n"; add_header Content-Type text/plain; }
        location = /health/authority    { proxy_pass http://authority_server/health; }
        location = /health/security     { proxy_pass http://security_api/health; }
        location = /health/manager      { proxy_pass http://manager_api/health; }
        location = /health/router       { proxy_pass http://router_api/health; }
        location = /health/geofencing   { proxy_pass http://geofencing_api/health; }
        location = /health/trip         { proxy_pass http://trip_api/health; }
        location = /health/telemetry    { proxy_pass http://telemetry_api/health; }
        location = /health/reporting    { proxy_pass http://reporting_api/health; }

        # Any extra local-only locations.
        include /etc/nginx/local.d/locations/*.conf;

        # The portal is NOT served from here - it runs on the Vite dev server.
        location / {
            return 200 "TrackHub local API gateway.\nThe portal runs at https://localhost:3000 (npm start in TrackHub.Portal).\n";
            add_header Content-Type text/plain;
        }
    }
}
