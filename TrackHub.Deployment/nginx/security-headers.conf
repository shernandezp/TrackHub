# Response headers every location must carry.
#
# nginx does NOT merge add_header across levels: a location that declares one of its own drops every
# header set above it. So this file is included at server level AND inside any location that adds a
# header of its own, rather than being written once at the top.
#
# The CSP is sized to what the portal actually loads, which is more than its own bundle:
#   - Google Maps is injected at RUNTIME by @react-google-maps/api for accounts whose map provider is
#     Google, so maps.googleapis.com must be a script source and its tile/icon hosts image sources.
#     Without them those accounts get a blank map and a console full of CSP violations.
#   - Leaflet (the other provider) ships locally, but its stylesheet and the Google Fonts CSS come
#     from unpkg and fonts.googleapis.com, and OpenStreetMap serves the tiles.
#   - 'unsafe-inline' for styles is required by the MUI runtime, which injects element styles.
# A split deployment whose API lives on another host tightens connect-src to that origin instead of
# the blanket https:.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://maps.googleapis.com https://maps.gstatic.com https://*.googleapis.com https://*.ggpht.com; connect-src 'self' https:; worker-src 'self' blob:; frame-src 'self' https://*.google.com; manifest-src 'self'" always;
