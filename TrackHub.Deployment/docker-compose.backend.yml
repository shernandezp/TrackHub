# TrackHub Backend-Only Deployment
# Use this for split deployment where backend runs on a separate server
# Frontend server should point API endpoints to this server's URL

services:
  nginx:
    image: nginx:alpine
    container_name: trackhub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.backend.conf:/etc/nginx/nginx.conf:ro
      - ./certificates:/etc/nginx/ssl:ro
      - ./certbot/webroot:/var/www/certbot:ro
    depends_on:
      - authority
      - security
      - manager
      - router
      - geofencing
      - tripmanagement
      - telemetry
      - reporting
    networks:
      - trackhub-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # AUTHORITY SERVER (OpenIddict Identity Server)
  # =============================================================================
  authority:
    build:
      context: ..
      dockerfile: TrackHub.Deployment/docker/Dockerfile.authority
    container_name: trackhub-authority
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Security=${DB_CONNECTION_SECURITY}
      - ConnectionStrings__Logging=${DB_CONNECTION_LOGGING}
      - AllowedCorsOrigins=${ALLOWED_CORS_ORIGINS}
      - OpenIddict__LoadCertFromFile=true
      - OpenIddict__Path=/app/certificates/certificate.pfx
      - OpenIddict__Password=${CERTIFICATE_PASSWORD}
      - OpenIddict__Scopes=${OPENIDDICT_SCOPES:-mobile_scope,driver_mobile_scope,web_scope,service_scope}
    volumes:
      - ./certificates:/app/certificates:ro
      - ./generated/appsettings.authority.json:/app/appsettings.json:ro
    networks:
      - trackhub-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      # db-init is a one-shot seeder with no healthcheck: wait for it to finish
      # seeding before the authority server boots.
      db-init:
        condition: service_completed_successfully

  # =============================================================================
  # SECURITY API (GraphQL)
  # =============================================================================
  security:
    build:
      context: ..
      dockerfile: TrackHub.Deployment/docker/Dockerfile.security
    container_name: trackhub-security
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Security=${DB_CONNECTION_SECURITY}
      - ConnectionStrings__Logging=${DB_CONNECTION_LOGGING}
      - AllowedCorsOrigins=${ALLOWED_CORS_ORIGINS}
      - AuthorityServer__Authority=${AUTHORITY_URL}
      - AuthorityServer__ValidateAudience=true
      - AuthorityServer__ValidateIssuer=true
      - AuthorityServer__ValidateIssuerSigningKey=true
      - AuthorityServer__ClientId=${SECURITY_CLIENT_ID}
      - AuthorityServer__ClientSecret=${SECURITY_CLIENT_SECRET}
      - AuthorityServer__Scope=service_scope
      - AppSettings__GraphQLManagerService=${GRAPHQL_MANAGER_SERVICE}
      - AppSettings__EncryptionKey=${ENCRYPTION_KEY}
      - OpenIddict__LoadCertFromFile=true
      - OpenIddict__Path=/app/certificates/certificate.pfx
      - OpenIddict__Password=${CERTIFICATE_PASSWORD}
    volumes:
      - ./certificates:/app/certificates:ro
      - ./generated/appsettings.security.json:/app/appsettings.json:ro
    networks:
      - trackhub-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - authority

  # =============================================================================
  # MANAGER API (GraphQL)
  # =============================================================================
  manager:
    build:
      context: ..
      dockerfile: TrackHub.Deployment/docker/Dockerfile.manager
    container_name: trackhub-manager
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_MANAGER}
      - ConnectionStrings__Logging=${DB_CONNECTION_LOGGING}
      - AllowedCorsOrigins=${ALLOWED_CORS_ORIGINS}
      - AuthorityServer__Authority=${AUTHORITY_URL}
      - AuthorityServer__ValidateAudience=true
      - AuthorityServer__ValidateIssuer=true
      - AuthorityServer__ValidateIssuerSigningKey=true
      - AppSettings__GraphQLIdentityService=${GRAPHQL_IDENTITY_SERVICE}
      - AppSettings__GraphQLSecurityService=${GRAPHQL_SECURITY_SERVICE}
      - AppSettings__GraphQLRouterService=${GRAPHQL_ROUTER_SERVICE}
      - AppSettings__EncryptionKey=${ENCRYPTION_KEY}
      - DocumentStorage__Provider=${DOCUMENT_STORAGE_PROVIDER:-LocalFileSystem}
      - DocumentStorage__LocalRootPath=${DOCUMENT_STORAGE_LOCAL_ROOT:-/app/documents}
      - DocumentStorage__RetentionDays=${DOCUMENT_RETENTION_DAYS:-1825}
      # S3 settings (required when DocumentStorage__Provider=S3; ignored otherwise).
      # BucketName is mandatory for S3; AccessKey/SecretKey may be left empty to use the
      # default AWS credential chain (IAM role / instance profile).
      - DocumentStorage__S3__BucketName=${DOCUMENT_S3_BUCKET_NAME:-}
      - DocumentStorage__S3__Region=${DOCUMENT_S3_REGION:-}
      - DocumentStorage__S3__ServiceUrl=${DOCUMENT_S3_SERVICE_URL:-}
      - DocumentStorage__S3__AccessKey=${DOCUMENT_S3_ACCESS_KEY:-}
      - DocumentStorage__S3__SecretKey=${DOCUMENT_S3_SECRET_KEY:-}
      - DocumentStorage__S3__ForcePathStyle=${DOCUMENT_S3_FORCE_PATH_STYLE:-}
      - DocumentStorage__S3__PresignedExpiryMinutes=${DOCUMENT_S3_PRESIGNED_EXPIRY_MINUTES:-}
      # Azure Blob settings (required when DocumentStorage__Provider=AzureBlob; ignored otherwise).
      - DocumentStorage__AzureBlob__ContainerName=${DOCUMENT_AZURE_CONTAINER_NAME:-}
      - DocumentStorage__AzureBlob__ConnectionString=${DOCUMENT_AZURE_CONNECTION_STRING:-}
      - DocumentStorage__AzureBlob__SasExpiryMinutes=${DOCUMENT_AZURE_SAS_EXPIRY_MINUTES:-}
      # Notifications (spec 05). Portal link in channel messages + delivery retention.
      # DOMAIN is the API host in this split profile, so set PORTAL_BASE_URL explicitly to the
      # frontend origin - otherwise the {link} token points at the backend.
      - AppSettings__PortalBaseUrl=${PORTAL_BASE_URL:-https://${DOMAIN}}
      - AppSettings__NotificationDeliveryRetentionDays=${NOTIFICATION_DELIVERY_RETENTION_DAYS:-90}
      # A delivery stuck in Sending (crashed dispatch cycle) is returned to Pending after this.
      - AppSettings__NotificationSendingReclaimMinutes=${NOTIFICATION_SENDING_RECLAIM_MINUTES:-10}
      # Platform retention sweep: job-run history and alert events older than these are purged.
      - AppSettings__BackgroundJobRunRetentionDays=${BACKGROUND_JOB_RUN_RETENTION_DAYS:-90}
      - AppSettings__AlertEventRetentionDays=${ALERT_EVENT_RETENTION_DAYS:-180}
      # Email channel (SMTP). Empty host disables sends. External blocker: a production relay.
      - AppSettings__Smtp__Host=${SMTP_HOST:-}
      - AppSettings__Smtp__Port=${SMTP_PORT:-25}
      - AppSettings__Smtp__Username=${SMTP_USERNAME:-}
      - AppSettings__Smtp__Password=${SMTP_PASSWORD:-}
      - AppSettings__Smtp__UseStartTls=${SMTP_USE_STARTTLS:-false}
      - AppSettings__Smtp__FromAddress=${SMTP_FROM_ADDRESS:-alerts@trackhub.local}
      - AppSettings__Smtp__FromName=${SMTP_FROM_NAME:-TrackHub Alerts}
      # WhatsApp channel (Meta Cloud API, outbound utility templates only). Empty values disable
      # sends. External blocker: verified Meta Business + WABA + approved templates.
      - AppSettings__WhatsApp__ApiBaseUrl=${WHATSAPP_API_BASE_URL:-https://graph.facebook.com/v21.0}
      - AppSettings__WhatsApp__PhoneNumberId=${WHATSAPP_PHONE_NUMBER_ID:-}
      - AppSettings__WhatsApp__AccessToken=${WHATSAPP_ACCESS_TOKEN:-}
      - AppSettings__WhatsApp__TemplateName=${WHATSAPP_TEMPLATE_NAME:-trackhub_alert}
      - OpenIddict__LoadCertFromFile=true
      - OpenIddict__Path=/app/certificates/certificate.pfx
      - OpenIddict__Password=${CERTIFICATE_PASSWORD}
    volumes:
      - ./certificates:/app/certificates:ro
      - ./generated/appsettings.manager.json:/app/appsettings.json:ro
      - manager-documents:/app/documents
    networks:
      - trackhub-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - security

  # =============================================================================
  # ROUTER API (GraphQL)
  # =============================================================================
  router:
    build:
      context: ..
      dockerfile: TrackHub.Deployment/docker/Dockerfile.router
    container_name: trackhub-router
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Logging=${DB_CONNECTION_LOGGING}
      - AllowedCorsOrigins=${ALLOWED_CORS_ORIGINS}
      - AuthorityServer__Authority=${AUTHORITY_URL}
      - AuthorityServer__ValidateAudience=true
      - AuthorityServer__ValidateIssuer=true
      - AuthorityServer__ValidateIssuerSigningKey=true
      - AuthorityServer__ClientId=${ROUTER_CLIENT_ID}
      - AuthorityServer__ClientSecret=${ROUTER_CLIENT_SECRET}
      - AuthorityServer__Scope=service_scope
      - AppSettings__GraphQLIdentityService=${GRAPHQL_IDENTITY_SERVICE}
      - AppSettings__GraphQLManagerService=${GRAPHQL_MANAGER_SERVICE}
      - AppSettings__GraphQLTelemetryService=${GRAPHQL_TELEMETRY_SERVICE}
      - AppSettings__GraphQLGeofenceService=${GRAPHQL_GEOFENCE_SERVICE}
      # Router forwards stored position batches to TripManagement (processTripPositions).
      - AppSettings__GraphQLTripManagementService=${GRAPHQL_TRIP_SERVICE}
      - AppSettings__EncryptionKey=${ENCRYPTION_KEY}
      - AppSettings__Protocols__0=CommandTrack
      - AppSettings__Protocols__1=Flespi
      - AppSettings__Protocols__2=GeoTab
      - AppSettings__Protocols__3=GpsGate
      - AppSettings__Protocols__4=Navixy
      - AppSettings__Protocols__5=Protrack
      - AppSettings__Protocols__6=Samsara
      - AppSettings__Protocols__7=Traccar
      - AppSettings__Protocols__8=Wialon
      - OpenIddict__LoadCertFromFile=true
      - OpenIddict__Path=/app/certificates/certificate.pfx
      - OpenIddict__Password=${CERTIFICATE_PASSWORD}
    volumes:
      - ./certificates:/app/certificates:ro
      - ./generated/appsettings.router.json:/app/appsettings.json:ro
    networks:
      - trackhub-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - manager

  # =============================================================================
  # GEOFENCING API (GraphQL)
  # =============================================================================
  geofencing:
    build:
      context: ..
      dockerfile: TrackHub.Deployment/docker/Dockerfile.geofencing
    container_name: trackhub-geofencing
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_MANAGER}
      - ConnectionStrings__Logging=${DB_CONNECTION_LOGGING}
      - AllowedCorsOrigins=${ALLOWED_CORS_ORIGINS}
      - AuthorityServer__Authority=${AUTHORITY_URL}
      - AuthorityServer__ValidateAudience=true
      - AuthorityServer__ValidateIssuer=true
      - AuthorityServer__ValidateIssuerSigningKey=true
      - AuthorityServer__ClientId=${GEOFENCE_CLIENT_ID}
      - AuthorityServer__ClientSecret=${GEOFENCE_CLIENT_SECRET}
      - AuthorityServer__Scope=service_scope
      - AppSettings__GraphQLIdentityService=${GRAPHQL_IDENTITY_SERVICE}
      - AppSettings__GraphQLManagerService=${GRAPHQL_MANAGER_SERVICE}
      - OpenIddict__LoadCertFromFile=true
      - OpenIddict__Path=/app/certificates/certificate.pfx
      - OpenIddict__Password=${CERTIFICATE_PASSWORD}
    volumes:
      - ./certificates:/app/certificates:ro
      - ./generated/appsettings.geofencing.json:/app/appsettings.json:ro
    networks:
      - trackhub-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          memory: 192M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - manager

  # =============================================================================
  # TRIP MANAGEMENT API (GraphQL)
  # =============================================================================
  tripmanagement:
    build:
      context: ..
      dockerfile: TrackHub.Deployment/docker/Dockerfile.tripmanagement
    container_name: trackhub-tripmanagement
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # The `trip` schema lives in the same TrackHub database as Manager/Geofencing
      # (it needs the same postgis extension).
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_MANAGER}
      - ConnectionStrings__Logging=${DB_CONNECTION_LOGGING}
      - AllowedCorsOrigins=${ALLOWED_CORS_ORIGINS}
      - AuthorityServer__Authority=${AUTHORITY_URL}
      - AuthorityServer__ValidateAudience=true
      - AuthorityServer__ValidateIssuer=true
      - AuthorityServer__ValidateIssuerSigningKey=true
      - AuthorityServer__ClientId=${TRIP_CLIENT_ID}
      - AuthorityServer__ClientSecret=${TRIP_CLIENT_SECRET}
      - AuthorityServer__Scope=service_scope
      - AppSettings__GraphQLIdentityService=${GRAPHQL_IDENTITY_SERVICE}
      - AppSettings__GraphQLManagerService=${GRAPHQL_MANAGER_SERVICE}
      - AppSettings__GraphQLTelemetryService=${GRAPHQL_TELEMETRY_SERVICE}
      # Routing provider (OpenRouteService). REQUIRED per deployment: with an empty
      # ApiKey route planning degrades to RoutePlan.Failed + ROUTING_NOT_CONFIGURED
      # (trips stay usable, but no route is ever produced). Point BaseUrl at a
      # self-hosted ORS instance to avoid the public quota.
      - AppSettings__Routing__Provider=${ROUTING_PROVIDER:-OpenRouteService}
      - AppSettings__Routing__BaseUrl=${ORS_BASE_URL:-https://api.openrouteservice.org}
      - AppSettings__Routing__ApiKey=${ORS_API_KEY:-}
      - AppSettings__Routing__Profile=${ORS_PROFILE:-driving-hgv}
      - AppSettings__Routing__RequestsPerSecond=${ORS_REQUESTS_PER_SECOND:-2}
      - AppSettings__Routing__TimeoutSeconds=${ORS_TIMEOUT_SECONDS:-30}
      - AppSettings__Routing__MaxWaypoints=${ORS_MAX_WAYPOINTS:-50}
      # Admission control: an interactive caller waits at most InteractiveTimeoutSeconds for a
      # slot; background ETA refreshes are additionally capped per rolling window.
      - AppSettings__Routing__InteractiveTimeoutSeconds=${ORS_INTERACTIVE_TIMEOUT_SECONDS:-15}
      - AppSettings__Routing__BackgroundRequestsPerWindow=${ORS_BACKGROUND_REQUESTS_PER_WINDOW:-250}
      - AppSettings__Routing__BackgroundWindowSeconds=${ORS_BACKGROUND_WINDOW_SECONDS:-300}
      - OpenIddict__LoadCertFromFile=true
      - OpenIddict__Path=/app/certificates/certificate.pfx
      - OpenIddict__Password=${CERTIFICATE_PASSWORD}
    volumes:
      - ./certificates:/app/certificates:ro
      - ./generated/appsettings.tripmanagement.json:/app/appsettings.json:ro
    networks:
      - trackhub-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          memory: 192M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - manager

  # =============================================================================
  # TELEMETRY API (GraphQL)
  # =============================================================================
  telemetry:
    build:
      context: ..
      dockerfile: TrackHub.Deployment/docker/Dockerfile.telemetry
    container_name: trackhub-telemetry
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_TELEMETRY}
      - ConnectionStrings__Logging=${DB_CONNECTION_LOGGING}
      - AllowedCorsOrigins=${ALLOWED_CORS_ORIGINS}
      - AuthorityServer__Authority=${AUTHORITY_URL}
      - AuthorityServer__ValidateAudience=true
      - AuthorityServer__ValidateIssuer=true
      - AuthorityServer__ValidateIssuerSigningKey=true
      - AppSettings__GraphQLIdentityService=${GRAPHQL_IDENTITY_SERVICE}
      - OpenIddict__LoadCertFromFile=true
      - OpenIddict__Path=/app/certificates/certificate.pfx
      - OpenIddict__Password=${CERTIFICATE_PASSWORD}
    volumes:
      - ./certificates:/app/certificates:ro
      - ./generated/appsettings.telemetry.json:/app/appsettings.json:ro
    networks:
      - trackhub-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          memory: 192M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - manager

  # =============================================================================
  # REPORTING API (REST)
  # =============================================================================
  reporting:
    build:
      context: ..
      dockerfile: TrackHub.Deployment/docker/Dockerfile.reporting
    container_name: trackhub-reporting
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Logging=${DB_CONNECTION_LOGGING}
      - AllowedCorsOrigins=${ALLOWED_CORS_ORIGINS}
      - AuthorityServer__Authority=${AUTHORITY_URL}
      - AuthorityServer__ValidateAudience=true
      - AuthorityServer__ValidateIssuer=true
      - AuthorityServer__ValidateIssuerSigningKey=true
      - AuthorityServer__ClientId=${REPORTING_CLIENT_ID}
      - AuthorityServer__ClientSecret=${REPORTING_CLIENT_SECRET}
      - AppSettings__GraphQLIdentityService=${GRAPHQL_IDENTITY_SERVICE}
      - AppSettings__GraphQLRouterService=${GRAPHQL_ROUTER_SERVICE}
      - AppSettings__GraphQLGeofenceService=${GRAPHQL_GEOFENCE_SERVICE}
      - AppSettings__GraphQLManagerService=${GRAPHQL_MANAGER_SERVICE}
      - AppSettings__GraphQLTelemetryService=${GRAPHQL_TELEMETRY_SERVICE}
      - AppSettings__GraphQLTripManagementService=${GRAPHQL_TRIP_SERVICE}
      # Report export/preview row limits (ReportingLimitsOptions defaults 100000 / 500 / 100).
      - AppSettings__Reporting__MaxExportRows=${REPORTING_MAX_EXPORT_ROWS:-100000}
      - AppSettings__Reporting__MaxPdfRows=${REPORTING_MAX_PDF_ROWS:-500}
      - AppSettings__Reporting__PreviewRows=${REPORTING_PREVIEW_ROWS:-100}
      - OpenIddict__LoadCertFromFile=true
      - OpenIddict__Path=/app/certificates/certificate.pfx
      - OpenIddict__Password=${CERTIFICATE_PASSWORD}
    volumes:
      - ./certificates:/app/certificates:ro
      - ./generated/appsettings.reporting.json:/app/appsettings.json:ro
    networks:
      - trackhub-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          memory: 192M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - router
      - geofencing
      - tripmanagement

  # =============================================================================
  # DATABASE INITIALIZATION (runs once)
  # =============================================================================
  db-init:
    build:
      context: ..
      dockerfile: TrackHub.Deployment/docker/Dockerfile.db-init
    container_name: trackhub-db-init
    environment:
      - DB_CONNECTION_SECURITY=${DB_CONNECTION_SECURITY}
      - DB_CONNECTION_MANAGER=${DB_CONNECTION_MANAGER}
    volumes:
      - ./config/clients.json:/app/clients.json:ro
      - db-init-flag:/app/flags
    networks:
      - trackhub-network

  # =============================================================================
  # SYNC WORKER (Background Service)
  # =============================================================================
  syncworker:
    build:
      context: ..
      dockerfile: TrackHub.Deployment/docker/Dockerfile.syncworker
    container_name: trackhub-syncworker
    restart: unless-stopped
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ConnectionStrings__Logging=${DB_CONNECTION_LOGGING}
      - AuthorityServer__Authority=${AUTHORITY_URL}
      - AuthorityServer__ClientId=${SYNCWORKER_CLIENT_ID}
      - AuthorityServer__ClientSecret=${SYNCWORKER_CLIENT_SECRET}
      # SyncWorker authenticates as a service (client credentials); GraphQLClientFactory
      # only attaches a service token when AuthorityServer__IsService is true.
      - AuthorityServer__IsService=true
      - AuthorityServer__Scope=service_scope
      - AppSettings__GraphQLIdentityService=${GRAPHQL_IDENTITY_SERVICE}
      - AppSettings__GraphQLManagerService=${GRAPHQL_MANAGER_SERVICE}
      - AppSettings__GraphQLTelemetryService=${GRAPHQL_TELEMETRY_SERVICE}
      - AppSettings__GraphQLGeofenceService=${GRAPHQL_GEOFENCE_SERVICE}
      - AppSettings__GraphQLTripManagementService=${GRAPHQL_TRIP_SERVICE}
      - AppSettings__EncryptionKey=${ENCRYPTION_KEY}
      # Full protocol list — must stay in sync with the router service above.
      # (Mettax exists in the ProtocolType enum but is not wired into the Router DI
      # assembly, so it must NOT be listed here.)
      - AppSettings__Protocols__0=CommandTrack
      - AppSettings__Protocols__1=Flespi
      - AppSettings__Protocols__2=GeoTab
      - AppSettings__Protocols__3=GpsGate
      - AppSettings__Protocols__4=Navixy
      - AppSettings__Protocols__5=Protrack
      - AppSettings__Protocols__6=Samsara
      - AppSettings__Protocols__7=Traccar
      - AppSettings__Protocols__8=Wialon
      - OpenIddict__LoadCertFromFile=true
      - OpenIddict__Path=/app/certificates/certificate.pfx
      - OpenIddict__Password=${CERTIFICATE_PASSWORD}
    volumes:
      - ./certificates:/app/certificates:ro
      - ./generated/appsettings.syncworker.json:/app/appsettings.json:ro
    networks:
      - trackhub-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    depends_on:
      authority:
        condition: service_healthy
      manager:
        condition: service_healthy

networks:
  trackhub-network:
    driver: bridge

volumes:
  db-init-flag:
    driver: local
  manager-documents:
    driver: local
